<div class="login-wrapper">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Accede a tu panel de Nexora</p>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />
    </div>

    <p class="error" *ngIf="errorMensaje">{{ errorMensaje }}</p>

    <button type="submit" class="btn-primary" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
    <p class="switch-link">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </form>
</div>
