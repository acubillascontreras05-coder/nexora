<div class="solution-wrapper" *ngIf="servicio; else noEncontrado">

  <a routerLink="/" class="back-link">← Volver al inicio</a>

  <div class="solution-header">
    <span class="service-icon-big">{{ servicio.icono }}</span>
    <h1>{{ servicio.titulo }}</h1>
    <p class="subtitulo">{{ servicio.subtitulo }}</p>
  </div>

  <p class="introduccion">{{ servicio.introduccion }}</p>

  <div class="solution-grid">

    <div class="solution-block">
      <h2>Qué incluye</h2>
      <ul>
        <li *ngFor="let item of servicio.incluye">{{ item }}</li>
      </ul>
    </div>

    <div class="solution-block">
      <h2>Beneficios para tu negocio</h2>
      <ul>
        <li *ngFor="let item of servicio.beneficios">{{ item }}</li>
      </ul>
    </div>

  </div>

  <div class="solution-cta">
    
       <a href="https://wa.me/51907520777?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20el%20servicio%20de%20{{ servicio.titulo }}"
      target="_blank"
      rel="noopener"
      class="primary-btn"
    >
      Solicitar este servicio
    </a>
  </div>

</div>

<ng-template #noEncontrado>
  <div class="solution-wrapper">
    <a routerLink="/" class="back-link">← Volver al inicio</a>
    <h1>Servicio no encontrado</h1>
    <p>Revisa el enlace o vuelve al inicio.</p>
  </div>
</ng-template>
