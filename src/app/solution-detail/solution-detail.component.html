<div class="solution-wrapper" *ngIf="solucion; else noEncontrada">

  <a routerLink="/" class="back-link">← Volver al inicio</a>

  <div class="solution-header">
    <h1>{{ solucion.titulo }}</h1>
    <p class="subtitulo">{{ solucion.subtitulo }}</p>
  </div>

  <p class="introduccion">{{ solucion.introduccion }}</p>

  <div class="solution-grid">

    <div class="solution-block">
      <h2>Qué incluye</h2>
      <ul>
        <li *ngFor="let item of solucion.incluye">{{ item }}</li>
      </ul>
    </div>

    <div class="solution-block">
      <h2>Beneficios para tu negocio</h2>
      <ul>
        <li *ngFor="let item of solucion.beneficios">{{ item }}</li>
      </ul>
    </div>

  </div>

  <div class="solution-cta">
    
      <a href="https://wa.me/51907520777?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20la%20soluci%C3%B3n%20de%20{{ solucion.titulo }}"
      target="_blank"
      rel="noopener"
      class="primary-btn"
    >
      Solicitar esta solución
    </a>
  </div>

</div>

<ng-template #noEncontrada>
  <div class="solution-wrapper">
    <a routerLink="/" class="back-link">← Volver al inicio</a>
    <h1>Solución no encontrada</h1>
    <p>Revisa el enlace o vuelve al inicio.</p>
  </div>
</ng-template>
